</head>
<body>

  <!-- ORE UI TOP HEADER BAR -->
  <div class="ore-topbar">
    <div class="brand-cluster">
      <span class="mc-block-icon"></span>
      <div>
        <h1 class="ore-title">AutoPathingFTC</h1>
      </div>
      <span class="ore-tag">PINPOINT ODOMETRY</span>
      <span id="statusToast" class="mc-toast"></span>
    </div>

    <div class="btn-group">
      <button id="btnSim" onclick="toggleSimulation()">▶ Simulate</button>
      <button onclick="copyJavaCode()">📋 Copy Code</button>
      <button class="btn-diamond" onclick="sendToAndroidStudio()">⚡ Send to TeamCode</button>
      <button class="btn-emerald" onclick="downloadJavaFile()">⬇ Save .java File</button>
    </div>
  </div>

  <!-- MAIN WORKSPACE -->
  <div class="workspace">

    <div class="main-grid">

      <!-- LEFT PANEL: CHUNK MAP CANVAS -->
      <div class="ore-panel">
        <div class="ore-panel-header">
          <span class="ore-section-title">🗺️ FTC Field Map (Origin 0,0,0°)</span>
          <div class="btn-group">
            <button class="btn-sm btn-dark" onclick="loadPreset('baseline')">Baseline</button>
            <button class="btn-sm btn-dark" onclick="loadPreset('square')">24" Box</button>
            <button class="btn-sm btn-dark" onclick="loadPreset('zigzag')">S-Curve</button>
            <button class="btn-sm btn-dark" onclick="loadPreset('outback')">Out &amp; Back</button>
            <button class="btn-sm btn-redstone" onclick="clearWaypoints()">Clear</button>
          </div>
        </div>

        <!-- SNAP & STRAIGHT-LINE ALIGNMENT BAR -->
        <div class="ore-slot snap-toolbar">
          <div class="snap-controls-left">

            </label>

            <select id="selGridStep" onchange="drawField()" style="width:142px; padding:4px 6px;">

          <button class="btn-sm btn-emerald" onclick="snapAllWaypointsToGrid()" title="Snap all existing dots onto the current grid points">
            ⚡ Align All Dots
          </button>

        <div class="ore-slot canvas-wrap">
          <canvas id="fieldCanvas" width="540" height="540"></canvas>
        </div>

        <div class="ore-slot legend-bar">
          <div class="legend-items">
            <span class="legend-item"><span class="block-swatch" style="background:#55FF55;"></span>Spawn (0,0)</span>
            <span class="legend-item"><span class="block-swatch" style="background:#55FFFF;"></span>Stop</span>
            <span class="legend-item"><span class="block-swatch" style="background:#FFAA00;"></span>Pass</span>

      <div class="ore-panel" style="display:flex; flex-direction:column; justify-content:space-between;">
        <div>
          <div class="ore-panel-header">
            <span class="ore-section-title">⛏️ Waypoints &amp; Block Actions</span>

          </div>
          <div class="settings-row">
            <span>OpMode Mode:</span>
            <select id="opModeType" onchange="refreshOutput()" style="width:235px;">
              <option value="TeleOp">@TeleOp (Gamepad + Replay)</option>
              <option value="Autonomous">@Autonomous (Competition)</option>
            </select>
          </div>
          <div class="settings-row">

    <!-- BOTTOM PANEL: COMMAND BLOCK JAVA OUTPUT -->
    <div class="ore-panel">
      <div class="ore-panel-header">
        <span class="ore-section-title">⚡ Command Block Output (<span id="fileNameLabel" style="color:#55FF55;">AutoPathOpMode.java</span>)</span>
        <span style="font-size:12px; color:var(--ore-text-dim); font-weight:700;">
          TeamCode/src/main/java/org/firstinspires/ftc/teamcode/
        </span>

  <script>
    const FIELD_HALF_INCHES = 48;
    const LINE_SNAP_THRESHOLD_IN = 3.0; // Magnetically lock to straight line within 3.0 inches
    const canvas = document.getElementById('fieldCanvas');
    const ctx = canvas.getContext('2d');

    // Starts with the verified locked baseline 4-dot path
    let waypoints = [
      { x: 24.0, y: 0.0,  heading: 90.0,  action: 'STOP_AND_WAIT', waitSec: 0.5, speed: 0.50, label: 'Dot 1' },
      { x: 24.0, y: 24.0, heading: 180.0, action: 'STOP_AND_WAIT', waitSec: 0.5, speed: 0.50, label: 'Dot 2' },
      { x: 0.0,  y: 24.0, heading: -90.0, action: 'STOP_AND_WAIT', waitSec: 0.5, speed: 0.50, label: 'Dot 3' },
      { x: 0.0,  y: 0.0,  heading: 0.0,   action: 'STOP_AND_HOLD', waitSec: 0.0, speed: 0.50, label: 'Dot 4' }
    ];

    let selectedIndex = 0;
    let draggingIndex = -1;
    let hoverSnapCoord = null; // Shows the magnetic snap reticule on hover
    let activeSnapGuides = []; // Stores active straight-line laser guides { type: 'X'|'Y', value: number, refLabel: string }

    let simRunning = false;
    let simAnimId = null;
    let simRobot = { x: 0, y: 0, heading: 0, targetIdx: 0, waitTimer: 0 };
    let lastSimTimestamp = 0;

    function showToast(msg) {
      const el = document.getElementById('statusToast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3200);
    }

    function getCleanClassName() {
      let raw = (document.getElementById('classNameInput').value || 'AutoPathOpMode').trim();
      raw = raw.replace(/[^a-zA-Z0-9_]/g, '');
      if (!raw) raw = 'AutoPathOpMode';
      // Java identifiers cannot start with a digit
      if (/^[0-9]/.test(raw)) raw = 'Path' + raw;
      return raw;
    }

    function fieldToCanvas(xIn, yIn) {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const scale = (canvas.width / 2) / FIELD_HALF_INCHES;
      const px = cx - yIn * scale;
      const py = cy - xIn * scale;
      return { px, py };
    }

    function canvasToFieldRaw(px, py) {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const scale = (canvas.width / 2) / FIELD_HALF_INCHES;
      const yIn = -(px - cx) / scale;
      const xIn = -(py - cy) / scale;
      return {
        x: Math.max(-FIELD_HALF_INCHES, Math.min(FIELD_HALF_INCHES, xIn)),
        y: Math.max(-FIELD_HALF_INCHES, Math.min(FIELD_HALF_INCHES, yIn))
      };
    }

    // Computes snapped field coordinates + active straight-line guides
    function computeSnappedCoord(rawX, rawY, wpIdx, shiftKey) {
      const gridSnapOn = document.getElementById('chkGridSnap').checked;
      const lineSnapOn = document.getElementById('chkLineSnap').checked;
      const gridStep = parseFloat(document.getElementById('selGridStep').value) || 6.0;

      let x = rawX;
      let y = rawY;
      const guides = [];

      // 1. Snap to grid point intervals first if enabled
      if (gridSnapOn) {
        x = Math.round(x / gridStep) * gridStep;
        y = Math.round(y / gridStep) * gridStep;
      } else {
        x = Math.round(x * 2) / 2;
        y = Math.round(y * 2) / 2;
      }

      // 2. Collect reference points for straight-line alignment (Origin, Previous Dot, Next Dot)
      const refs = [{ x: 0.0, y: 0.0, name: 'Origin (0,0)' }];
      if (wpIdx > 0 && waypoints[wpIdx - 1]) {
        refs.push({ x: waypoints[wpIdx - 1].x, y: waypoints[wpIdx - 1].y, name: `Dot ${wpIdx}` });
      } else if (wpIdx === -1 && waypoints.length > 0) {
        const lastIdx = waypoints.length - 1;
        refs.push({ x: waypoints[lastIdx].x, y: waypoints[lastIdx].y, name: `Dot ${lastIdx + 1}` });
      }
      if (wpIdx >= 0 && wpIdx + 1 < waypoints.length && waypoints[wpIdx + 1]) {
        refs.push({ x: waypoints[wpIdx + 1].x, y: waypoints[wpIdx + 1].y, name: `Dot ${wpIdx + 2}` });
      }

      // If Shift is held, strictly lock to horizontal or vertical from the immediate predecessor
      if (shiftKey && refs.length > 1) {
        const prevRef = refs[1];
        if (Math.abs(rawX - prevRef.x) < Math.abs(rawY - prevRef.y)) {
          x = prevRef.x;
          guides.push({ axis: 'X', value: x, refX: prevRef.x, refY: prevRef.y, label: `LINE X=${x.toFixed(1)}"` });
        } else {
          y = prevRef.y;
          guides.push({ axis: 'Y', value: y, refX: prevRef.x, refY: prevRef.y, label: `LINE Y=${y.toFixed(1)}"` });
        }
      } else if (lineSnapOn) {
        // Magnetic straight-line lock when near any reference X or Y
        let bestDx = LINE_SNAP_THRESHOLD_IN + 0.01;
        let matchedRefX = null;
        for (const r of refs) {
          const dx = Math.abs(rawX - r.x);
          if (dx <= LINE_SNAP_THRESHOLD_IN && dx < bestDx) {
            bestDx = dx;
            matchedRefX = r;
          }
        }
        if (matchedRefX) {
          x = matchedRefX.x;
          guides.push({ axis: 'X', value: x, refX: matchedRefX.x, refY: matchedRefX.y, label: `STRAIGHT X=${x.toFixed(1)}"` });
        }

        let bestDy = LINE_SNAP_THRESHOLD_IN + 0.01;
        let matchedRefY = null;
        for (const r of refs) {
          const dy = Math.abs(rawY - r.y);
          if (dy <= LINE_SNAP_THRESHOLD_IN && dy < bestDy) {
            bestDy = dy;
            matchedRefY = r;
          }
        }
        if (matchedRefY) {
          y = matchedRefY.y;
          guides.push({ axis: 'Y', value: y, refX: matchedRefY.x, refY: matchedRefY.y, label: `STRAIGHT Y=${y.toFixed(1)}"` });
        }
      }

      x = Math.max(-FIELD_HALF_INCHES, Math.min(FIELD_HALF_INCHES, x));
      y = Math.max(-FIELD_HALF_INCHES, Math.min(FIELD_HALF_INCHES, y));
      return { x, y, guides };
    }

    function snapAllWaypointsToGrid() {
      const gridStep = parseFloat(document.getElementById('selGridStep').value) || 6.0;
      waypoints.forEach(wp => {
        wp.x = Math.round(wp.x / gridStep) * gridStep;
        wp.y = Math.round(wp.y / gridStep) * gridStep;
      });
      refreshAll();
      showToast(`★ ALL DOTS SNAPPED TO ${gridStep}" POINTS!`);
    }

    // Helper to draw a Minecraft beveled square block on canvas
    function drawMinecraftBlock(x, y, size, faceColor, topLight, bottomShade, isSelected) {
      const half = size / 2;
      if (isSelected) {
        ctx.fillStyle = '#FFFF55';
        ctx.fillRect(x - half - 4, y - half - 4, size + 8, size + 8);
      }
      // Outer black border
      ctx.fillStyle = '#000000';
      ctx.fillRect(x - half - 2, y - half - 2, size + 4, size + 4);
      // Main block face
      ctx.fillStyle = faceColor;
      ctx.fillRect(x - half, y - half, size, size);
      // Top/Left pixel bevel highlight
      ctx.fillStyle = topLight;
      ctx.fillRect(x - half, y - half, size, 3);
      ctx.fillRect(x - half, y - half, 3, size);
      // Bottom/Right pixel bevel shadow
      ctx.fillStyle = bottomShade;
      ctx.fillRect(x - half, y + half - 3, size, 3);
      ctx.fillRect(x + half - 3, y - half, 3, size);
    }

    function drawField() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const scale = (canvas.width / 2) / FIELD_HALF_INCHES;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // Checkerboard Minecraft Deepslate Tiles (12" tiles)
      const tilePx = 12 * scale;
      for (let r = -4; r < 4; r++) {
        for (let c = -4; c < 4; c++) {
          const isEven = ((r + c) & 1) === 0;
          ctx.fillStyle = isEven ? '#1B1C1E' : '#202224';
          ctx.fillRect(cx + c * tilePx, cy + r * tilePx, tilePx, tilePx);
        }
      }

      // Grid lines every 6 inches
      ctx.lineWidth = 1;
      for (let inch = -FIELD_HALF_INCHES; inch <= FIELD_HALF_INCHES; inch += 6) {
        const offset = inch * scale;
        const isMajor = (inch % 12 === 0);
        ctx.strokeStyle = isMajor ? '#383A3D' : '#26282A';

        ctx.beginPath();
        ctx.moveTo(cx + offset, 0);
        ctx.lineTo(cx + offset, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, cy + offset);
        ctx.lineTo(canvas.width, cy + offset);
        ctx.stroke();
      }

      // Draw Visible Snap Grid Point Pegs when Grid Snap is active
      const gridSnapOn = document.getElementById('chkGridSnap').checked;
      const gridStep = parseFloat(document.getElementById('selGridStep').value) || 6.0;
      if (gridSnapOn) {
        const pegStep = Math.max(3, gridStep);
        for (let gx = -FIELD_HALF_INCHES; gx <= FIELD_HALF_INCHES; gx += pegStep) {
          for (let gy = -FIELD_HALF_INCHES; gy <= FIELD_HALF_INCHES; gy += pegStep) {
            const pt = fieldToCanvas(gx, gy);
            const isTileCorner = (gx % 12 === 0 && gy % 12 === 0);
            ctx.fillStyle = isTileCorner ? '#5E6268' : '#3E4145';
            const s = isTileCorner ? 3 : 2;
            ctx.fillRect(Math.round(pt.px - s / 2), Math.round(pt.py - s / 2), s, s);
          }
        }
      }

      // Main Chunk Axes (+X Forward, +Y Left)
      ctx.strokeStyle = '#686A6E';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height);
      ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy);
      ctx.stroke();

      // Axis Labels
      ctx.fillStyle = '#BCBEC0';
      ctx.font = '700 12px "PixelFont", monospace';
      ctx.fillText('+X FWD (+48")', cx + 8, 16);
      ctx.fillText('-X BACK (-48")', cx + 8, canvas.height - 8);
      ctx.fillText('+Y LEFT', 8, cy - 6);
      ctx.fillText('-Y RIGHT', canvas.width - 82, cy - 6);

      // Draw Active Straight-Line Alignment Laser Guides
      if (activeSnapGuides.length > 0) {
        ctx.save();
        ctx.strokeStyle = '#55FF55';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        activeSnapGuides.forEach((g, idx) => {
          const pt = fieldToCanvas(g.axis === 'X' ? g.value : 0, g.axis === 'Y' ? g.value : 0);
          ctx.beginPath();
          if (g.axis === 'X') {
            // Constant X = Horizontal line across the canvas
            ctx.moveTo(0, pt.py);
            ctx.lineTo(canvas.width, pt.py);
          } else {
            // Constant Y = Vertical line down the canvas
            ctx.moveTo(pt.px, 0);
            ctx.lineTo(pt.px, canvas.height);
          }
          ctx.stroke();

          // Draw Straight-Line Lock Badge
          ctx.fillStyle = '#111214';
          ctx.fillRect(10, 10 + idx * 24, 175, 20);
          ctx.strokeStyle = '#55FF55';
          ctx.setLineDash([]);
          ctx.strokeRect(10, 10 + idx * 24, 175, 20);
          ctx.fillStyle = '#55FF55';
          ctx.font = '700 12px "PixelFont", monospace';
          ctx.fillText('📏 ' + g.label, 16, 24 + idx * 24);
          ctx.setLineDash([6, 4]);
        });
        ctx.restore();
      }

      // Draw Magnetic Target Reticule on Hovered Snap Point
      if (hoverSnapCoord) {
        const hPt = fieldToCanvas(hoverSnapCoord.x, hoverSnapCoord.y);
        ctx.save();
        ctx.strokeStyle = '#FFFF55';
        ctx.lineWidth = 2;
        ctx.strokeRect(Math.round(hPt.px - 9), Math.round(hPt.py - 9), 18, 18);
        ctx.fillStyle = '#55FF55';
        ctx.fillRect(Math.round(hPt.px - 2), Math.round(hPt.py - 2), 4, 4);
        ctx.restore();
      }

      // Draw Path Lines between blocks
      let prevPt = { x: 0, y: 0 };
      waypoints.forEach((wp) => {
        const p1 = fieldToCanvas(prevPt.x, prevPt.y);
        const p2 = fieldToCanvas(wp.x, wp.y);

        const isStraightSegment = (Math.abs(wp.x - prevPt.x) < 0.01 || Math.abs(wp.y - prevPt.y) < 0.01);

        // Black outline under path line
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(p1.px, p1.py);
        ctx.lineTo(p2.px, p2.py);
        ctx.stroke();

        // Colored path beam
        ctx.strokeStyle = wp.action === 'PASS_THROUGH' ? '#FFAA00' : (isStraightSegment ? '#55FFFF' : '#38B8E8');
        ctx.lineWidth = 3;
        if (wp.action === 'PASS_THROUGH') {
          ctx.setLineDash([8, 6]);
        } else {
          ctx.setLineDash([]);
        }
        ctx.beginPath();
        ctx.moveTo(p1.px, p1.py);
        ctx.lineTo(p2.px, p2.py);
        ctx.stroke();
        ctx.setLineDash([]);

        // Midpoint Arrow
        const midX = (p1.px + p2.px) / 2;
        const midY = (p1.py + p2.py) / 2;
        const segLen = Math.hypot(wp.x - prevPt.x, wp.y - prevPt.y);
        if (segLen > 3) {
          const angle = Math.atan2(p2.py - p1.py, p2.px - p1.px);
          ctx.save();
          ctx.translate(midX, midY);
          ctx.rotate(angle);
          ctx.fillStyle = '#FFFF55';
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(7, 0);
          ctx.lineTo(-5, -5);
          ctx.lineTo(-5, 5);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }
        prevPt = wp;
      });

      // Draw Spawn Origin Block (0, 0, 0°) — Emerald Block
      const originCanvas = fieldToCanvas(0, 0);
      drawMinecraftBlock(originCanvas.px, originCanvas.py, 14, '#3C8527', '#55FF55', '#1D4D13', false);

      // Draw Waypoint Blocks & Heading Torch Vectors
      waypoints.forEach((wp, idx) => {
        const pt = fieldToCanvas(wp.x, wp.y);
        const isSelected = (idx === selectedIndex);

        const rad = (wp.heading * Math.PI) / 180.0;
        const dirPx = -Math.sin(rad);
        const dirPy = -Math.cos(rad);

        // Heading vector bar
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(pt.px, pt.py);
        ctx.lineTo(pt.px + dirPx * 24, pt.py + dirPy * 24);
        ctx.stroke();

        ctx.strokeStyle = isSelected ? '#FFFF55' : '#FFFFFF';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(pt.px, pt.py);
        ctx.lineTo(pt.px + dirPx * 24, pt.py + dirPy * 24);
        ctx.stroke();

        // Block Colors by Action
        let face = '#28A8B8', light = '#55FFFF', shade = '#145661'; // STOP_AND_WAIT (Diamond)
        if (wp.action === 'PASS_THROUGH') {
          face = '#D98200'; light = '#FFAA00'; shade = '#784500';   // PASS_THROUGH (Gold)
        } else if (wp.action === 'STOP_AND_HOLD') {
          face = '#8232C8'; light = '#AA55FF'; shade = '#43146E';   // STOP_AND_HOLD (Amethyst)
        }

        drawMinecraftBlock(pt.px, pt.py, 22, face, light, shade, isSelected);

        // Block Number
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '700 12px "PixelFont", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(idx + 1), pt.px, pt.py);
      });
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';

      // Draw Simulated Robot (Blocky Minecart / Iron Golem Chassis)
      if (simRunning) {
        const rPt = fieldToCanvas(simRobot.x, simRobot.y);
        const rSize = 14 * scale;
        ctx.save();
        ctx.translate(rPt.px, rPt.py);
        ctx.rotate(-(simRobot.heading * Math.PI) / 180.0);

        ctx.fillStyle = 'rgba(85, 255, 85, 0.28)';
        ctx.strokeStyle = '#55FF55';
        ctx.lineWidth = 3;
        ctx.fillRect(-rSize / 2, -rSize / 2, rSize, rSize);
        ctx.strokeRect(-rSize / 2, -rSize / 2, rSize, rSize);

        // Front directional beacon
        ctx.fillStyle = '#FFFF55';
        ctx.fillRect(-5, -rSize / 2 - 5, 10, 6);
        ctx.restore();
      }
    }

    function getMouseCanvasPos(evt) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        px: (evt.clientX - rect.left) * scaleX,
        py: (evt.clientY - rect.top) * scaleY
      };
    }

    canvas.addEventListener('mousedown', (evt) => {
      const { px, py } = getMouseCanvasPos(evt);
      for (let i = waypoints.length - 1; i >= 0; i--) {
        const pt = fieldToCanvas(waypoints[i].x, waypoints[i].y);
        if (Math.hypot(px - pt.px, py - pt.py) <= 15) {
          selectedIndex = i;
          draggingIndex = i;
          refreshAll();
          return;
        }
      }

      const raw = canvasToFieldRaw(px, py);
      const snapped = computeSnappedCoord(raw.x, raw.y, -1, evt.shiftKey);
      activeSnapGuides = snapped.guides;

      const prevHeading = waypoints.length > 0 ? waypoints[waypoints.length - 1].heading : 0.0;
      if (waypoints.length > 0 && waypoints[waypoints.length - 1].action === 'STOP_AND_HOLD') {
        waypoints[waypoints.length - 1].action = 'STOP_AND_WAIT';
        waypoints[waypoints.length - 1].waitSec = 0.5;
      }
      waypoints.push({
        x: snapped.x,
        y: snapped.y,
        heading: prevHeading,
        action: 'STOP_AND_HOLD',
        waitSec: 0.0,
        speed: 0.50,
        label: `Dot ${waypoints.length + 1}`
      });
      selectedIndex = waypoints.length - 1;
      draggingIndex = selectedIndex;
      refreshAll();
    });

    canvas.addEventListener('mousemove', (evt) => {
      const { px, py } = getMouseCanvasPos(evt);
      const raw = canvasToFieldRaw(px, py);
      const refIdx = draggingIndex !== -1 ? draggingIndex : -1;
      const snapped = computeSnappedCoord(raw.x, raw.y, refIdx, evt.shiftKey);

      hoverSnapCoord = { x: snapped.x, y: snapped.y };
      activeSnapGuides = snapped.guides;

      const lockTag = snapped.guides.length > 0 ? ' [LINE LOCK]' : '';
      document.getElementById('cursorReadout').textContent =
        `SNAP: X=${snapped.x.toFixed(1)}", Y=${snapped.y.toFixed(1)}"${lockTag}`;

      if (draggingIndex !== -1) {
        waypoints[draggingIndex].x = snapped.x;
        waypoints[draggingIndex].y = snapped.y;
        refreshAll();
      } else {
        drawField();
      }
    });

    canvas.addEventListener('mouseleave', () => {
      hoverSnapCoord = null;
      activeSnapGuides = [];
      drawField();
    });

    window.addEventListener('mouseup', () => {
      if (draggingIndex !== -1) {
        draggingIndex = -1;
        activeSnapGuides = [];
        drawField();
      }
    });

      container.innerHTML = waypoints.map((wp, idx) => {

              </div>

                <label>Y LEFT (IN)</label>

                  <option value="STOP_AND_WAIT" ${wp.action === 'STOP_AND_WAIT' ? 'selected' : ''}>Stop &amp; Wait (PID Brake)</option>
                  <option value="PASS_THROUGH" ${wp.action === 'PASS_THROUGH' ? 'selected' : ''}>Pass Through Smoothly</option>
                  <option value="STOP_AND_HOLD" ${wp.action === 'STOP_AND_HOLD' ? 'selected' : ''}>Final Stop &amp; Hold Pose</option>
                </select>

              <div>
                <label>MAX SPD</label>
                <input type="number" step="0.05" min="0.15" max="1.0" value="${wp.speed}"
                  onchange="updateWp(${idx}, 'speed', Math.min(1.0, Math.max(0.15, parseFloat(this.value)||0.5)))" />

      }).join('');
    }

    function selectWaypoint(idx) { selectedIndex = idx; drawField(); }
    function updateWp(idx, key, val) {
      waypoints[idx][key] = val;
      if (key === 'action' && val !== 'STOP_AND_WAIT') {
        waypoints[idx].waitSec = 0.0;
      }
      refreshAll();
    }
    function deleteWaypoint(idx) {
      waypoints.splice(idx, 1);
      if (selectedIndex >= waypoints.length) selectedIndex = waypoints.length - 1;

    function toggleSimulation() {
      if (simRunning) {
        stopSimulation();
      } else {
        if (waypoints.length === 0) return;
        simRunning = true;
        simRobot = { x: 0, y: 0, heading: 0, targetIdx: 0, waitTimer: 0 };
        lastSimTimestamp = performance.now();
        document.getElementById('btnSim').textContent = '⏹ Stop';
        simAnimId = requestAnimationFrame(stepSimulation);
      }
    }

    function stopSimulation() {
      simRunning = false;
      if (simAnimId) cancelAnimationFrame(simAnimId);
      document.getElementById('btnSim').textContent = '▶ Simulate';
      drawField();
    }

    function stepSimulation(ts) {
      if (!simRunning) return;
      const dt = Math.min(0.05, (ts - lastSimTimestamp) / 1000);
      lastSimTimestamp = ts;

      if (simRobot.targetIdx >= waypoints.length) {
        stopSimulation();
        return;
      }

      const wp = waypoints[simRobot.targetIdx];
      const dx = wp.x - simRobot.x;
      const dy = wp.y - simRobot.y;
      const dist = Math.hypot(dx, dy);

      let dHeading = ((wp.heading - simRobot.heading + 540) % 360) - 180;
      const isPassThroughSeg = (wp.action === 'PASS_THROUGH' && simRobot.targetIdx < waypoints.length - 1);
      const arriveRadius = isPassThroughSeg ? 2.8 : 0.4;

      // Turn continuously during movement
      const turnRate = 260.0 * dt;
      if (Math.abs(dHeading) <= turnRate) {
        simRobot.heading = wp.heading;
      } else {
        simRobot.heading += Math.sign(dHeading) * turnRate;
      }

      if (isPassThroughSeg && dist <= arriveRadius) {
        // Immediately flow into the next waypoint without stopping or waiting for heading
        simRobot.waitTimer = 0;
        simRobot.targetIdx++;
      } else if (!isPassThroughSeg && dist < arriveRadius && Math.abs(dHeading) < 2.0) {
        if (wp.action === 'STOP_AND_WAIT' && simRobot.waitTimer < wp.waitSec) {
          simRobot.waitTimer += dt;
        } else {
          simRobot.waitTimer = 0;
          simRobot.targetIdx++;
        }
      } else {
        const moveSpeedInPerSec = wp.speed * 46.0;
        const step = Math.min(dist, moveSpeedInPerSec * dt);
        if (dist > 0.01) {
          simRobot.x += (dx / dist) * step;
          simRobot.y += (dy / dist) * step;
        }
      }

      drawField();
      simAnimId = requestAnimationFrame(stepSimulation);
    }

    function generateJavaSource() {
      const className = getCleanClassName();
      const modeType = document.getElementById('opModeType').value;
      const annotation = modeType === 'Autonomous'
        ? `@Autonomous(name = "${className} (Visual Planner)", group = "AutoPathingFTC")`
        : `@TeleOp(name = "${className} (Visual Planner)", group = "AutoPathingFTC")`;
      const importAnnotation = modeType === 'Autonomous'
        ? 'import com.qualcomm.robotcore.eventloop.opmode.Autonomous;'
        : 'import com.qualcomm.robotcore.eventloop.opmode.TeleOp;';

      const wpLines = waypoints.map((wp, i) => {
        const safeLabel = (wp.label || `Dot ${i + 1}`).replace(/"/g, '\\"');
        return `            new Waypoint(${wp.x.toFixed(2)}, ${wp.y.toFixed(2)}, ${wp.heading.toFixed(1)}, ActionType.${wp.action}, ${wp.waitSec.toFixed(2)}, ${wp.speed.toFixed(2)}, "${safeLabel}")`;
      }).join(',\n');

      return `package org.firstinspires.ftc.teamcode;

import com.qualcomm.hardware.gobilda.GoBildaPinpointDriver;
${importAnnotation}
import com.qualcomm.robotcore.eventloop.opmode.LinearOpMode;
import com.qualcomm.robotcore.hardware.DcMotor;
import com.qualcomm.robotcore.hardware.DcMotorEx;
import com.qualcomm.robotcore.util.ElapsedTime;
import com.qualcomm.robotcore.util.Range;

import org.firstinspires.ftc.robotcore.external.navigation.AngleUnit;
import org.firstinspires.ftc.robotcore.external.navigation.DistanceUnit;
import org.firstinspires.ftc.robotcore.external.navigation.Pose2D;
import org.firstinspires.ftc.robotcore.external.navigation.UnnormalizedAngleUnit;

${annotation}
public class ${className} extends LinearOpMode {

    public enum ActionType {
        STOP_AND_WAIT,
        PASS_THROUGH,
        STOP_AND_HOLD
    }

    public static class Waypoint {
        public final double xInches, yInches, headingDeg, waitSeconds, maxSpeed;
        public final ActionType action;
        public final String label;

        public Waypoint(double xInches, double yInches, double headingDeg,
                        ActionType action, double waitSeconds, double maxSpeed, String label) {
            this.xInches = xInches;
            this.yInches = yInches;
            this.headingDeg = headingDeg;
            this.action = action;
            this.waitSeconds = waitSeconds;
            this.maxSpeed = maxSpeed;
            this.label = label;
        }
    }

    // ================= VISUAL PLANNER WAYPOINTS (DOTS) =================
    private static final Waypoint[] PATH = new Waypoint[] {
${wpLines}
    };

    private static final String PINPOINT_NAME    = "odo";
    private static final String FRONT_RIGHT_NAME = "motor1";
    private static final String BACK_RIGHT_NAME  = "motor2";
    private static final String FRONT_LEFT_NAME  = "motor3";
    private static final String BACK_LEFT_NAME   = "motor4";

    private static final double KP_FORWARD = 0.085, KI_FORWARD = 0.025, KD_FORWARD = 0.012, MIN_FORWARD_POWER = 0.075;
    private static final double KP_STRAFE  = 0.130, KI_STRAFE  = 0.045, KD_STRAFE  = 0.015, MIN_STRAFE_POWER  = 0.135;
    private static final double KP_HEADING = 1.05,  KI_HEADING = 0.15,  KD_HEADING = 0.04,  MIN_TURN_POWER    = 0.09;
    private static final double MAX_TURN_SPEED = 0.55;

    private static final double STOP_TOLERANCE_INCHES  = 0.20;
    private static final double PASS_THROUGH_RADIUS_IN = 3.50;
    private static final double HEADING_TOLERANCE_DEG  = 1.0;
    private static final double INTEGRAL_ZONE_INCHES   = 3.5;
    private static final double MAX_INTEGRAL_POWER     = 0.12;

    private GoBildaPinpointDriver odo;
    private DcMotorEx frontRight, backRight, frontLeft, backLeft;

    private double poseX = 0.0, poseY = 0.0, poseHeading = 0.0;
    private double velX = 0.0, velY = 0.0, velHeading = 0.0;
    private double integralFwd = 0.0, integralStrafe = 0.0, integralTurn = 0.0;

    private final ElapsedTime loopTimer = new ElapsedTime();
    private final ElapsedTime waitTimer = new ElapsedTime();
    private boolean currentlyBraking = false;

    private double forwardSign = -1.0, strafeSign = 1.0, turnSign = 1.0;
    private int currentIndex = 0;
    private boolean waitingAtDot = false;
    private boolean lastX = false, lastY = false, lastB = false, lastRB = false;

    @Override
    public void runOpMode() {
        frontRight = hardwareMap.get(DcMotorEx.class, FRONT_RIGHT_NAME);
        backRight  = hardwareMap.get(DcMotorEx.class, BACK_RIGHT_NAME);
        frontLeft  = hardwareMap.get(DcMotorEx.class, FRONT_LEFT_NAME);
        backLeft   = hardwareMap.get(DcMotorEx.class, BACK_LEFT_NAME);

        frontLeft.setDirection(DcMotor.Direction.REVERSE);
        backLeft.setDirection(DcMotor.Direction.REVERSE);
        frontRight.setDirection(DcMotor.Direction.FORWARD);
        backRight.setDirection(DcMotor.Direction.FORWARD);

        frontLeft.setMode(DcMotor.RunMode.RUN_WITHOUT_ENCODER);
        frontRight.setMode(DcMotor.RunMode.RUN_WITHOUT_ENCODER);
        backLeft.setMode(DcMotor.RunMode.RUN_WITHOUT_ENCODER);
        backRight.setMode(DcMotor.RunMode.RUN_WITHOUT_ENCODER);

        setZeroPowerMode(DcMotor.ZeroPowerBehavior.BRAKE);

        odo = hardwareMap.get(GoBildaPinpointDriver.class, PINPOINT_NAME);
        odo.setOffsets(0.0, 0.0, DistanceUnit.MM);
        odo.setEncoderResolution(GoBildaPinpointDriver.GoBildaOdometryPods.goBILDA_4_BAR_POD);
        odo.setEncoderDirections(
                GoBildaPinpointDriver.EncoderDirection.FORWARD,
                GoBildaPinpointDriver.EncoderDirection.REVERSED
        );
        odo.resetPosAndIMU();

        telemetry.addData("Status", "${className} Ready (%d Waypoints)", PATH.length);
        telemetry.update();

        waitForStart();
        resetOriginAndRestart();

        while (opModeIsActive()) {
            double dt = loopTimer.seconds();
            loopTimer.reset();
            if (dt <= 0.0 || dt > 0.2) dt = 0.02;

            updateOdometry();

            if (gamepad1.a) resetOriginAndRestart();
            if ((gamepad1.right_bumper && !lastRB) || gamepad1.dpad_up) {
                currentIndex = 0;
                waitingAtDot = false;
                clearIntegrals();
            }
            if (gamepad1.x && !lastX) forwardSign = -forwardSign;
            if (gamepad1.y && !lastY) strafeSign  = -strafeSign;
            if (gamepad1.b && !lastB) turnSign    = -turnSign;
            lastX = gamepad1.x; lastY = gamepad1.y; lastB = gamepad1.b; lastRB = gamepad1.right_bumper;

            if (PATH.length == 0) {
                setDrivePowers(0, 0, 0, 0);
                continue;
            }

            while (currentIndex < PATH.length - 1
                    && PATH[currentIndex].action == ActionType.PASS_THROUGH
                    && Math.hypot(PATH[currentIndex].xInches - poseX, PATH[currentIndex].yInches - poseY) <= PASS_THROUGH_RADIUS_IN) {
                currentIndex++;
                clearIntegrals();
            }

            Waypoint target = PATH[Math.min(currentIndex, PATH.length - 1)];
            boolean isPassThroughSegment = (target.action == ActionType.PASS_THROUGH && currentIndex < PATH.length - 1);
            double targetHeadingRad = Math.toRadians(target.headingDeg);

            double errorX = target.xInches - poseX;
            double errorY = target.yInches - poseY;
            double errorHeading = AngleUnit.normalizeRadians(targetHeadingRad - poseHeading);

            double cosH = Math.cos(-poseHeading);
            double sinH = Math.sin(-poseHeading);

            double robotForwardError = errorX * cosH - errorY * sinH;
            double robotLeftError    = errorX * sinH + errorY * cosH;

            double robotVelFwd  = velX * cosH - velY * sinH;
            double robotVelLeft = velX * sinH + velY * cosH;

            double distToTarget = Math.hypot(errorX, errorY);
            double headingErrorDeg = Math.abs(Math.toDegrees(errorHeading));

            boolean isAtForward = Math.abs(robotForwardError) < STOP_TOLERANCE_INCHES;
            boolean isAtStrafe  = Math.abs(robotLeftError) < STOP_TOLERANCE_INCHES;
            boolean isAtHeading = headingErrorDeg < HEADING_TOLERANCE_DEG;
            boolean isSettledAtDot = !isPassThroughSegment && isAtForward && isAtStrafe && isAtHeading;

            if (gamepad1.left_bumper) {
                setZeroPowerMode(DcMotor.ZeroPowerBehavior.FLOAT);
                setDrivePowers(0, 0, 0, 0);
                clearIntegrals();
            } else if (isSettledAtDot) {
                setDrivePowers(0, 0, 0, 0);
                clearIntegrals();

                if (target.action == ActionType.STOP_AND_WAIT && currentIndex < PATH.length - 1) {
                    if (target.waitSeconds <= 0.01) {
                        waitingAtDot = false;
                        currentIndex++;
                    } else {
                        if (!waitingAtDot) {
                            waitingAtDot = true;
                            waitTimer.reset();
                        }
                        if (waitTimer.seconds() >= target.waitSeconds) {
                            waitingAtDot = false;
                            currentIndex++;
                        }
                    }
                }
            } else {
                waitingAtDot = false;
                setZeroPowerMode(DcMotor.ZeroPowerBehavior.BRAKE);

                double maxSpeed = target.maxSpeed;
                double forwardCmd = 0.0;
                double strafeRightCmd = 0.0;

                if (isPassThroughSegment && distToTarget > 0.05) {
                    double dirFwd = robotForwardError / distToTarget;
                    double dirRight = (-robotLeftError) / distToTarget;
                    forwardCmd = forwardSign * dirFwd * maxSpeed;
                    strafeRightCmd = strafeSign * dirRight * maxSpeed;
                    integralFwd = 0.0;
                    integralStrafe = 0.0;
                } else {
                    if (Math.abs(robotForwardError) < INTEGRAL_ZONE_INCHES && !isAtForward) {
                        integralFwd = Range.clip(integralFwd + robotForwardError * dt,
                                -MAX_INTEGRAL_POWER / KI_FORWARD, MAX_INTEGRAL_POWER / KI_FORWARD);
                    } else integralFwd = 0.0;

                    if (Math.abs(robotLeftError) < INTEGRAL_ZONE_INCHES && !isAtStrafe) {
                        integralStrafe = Range.clip(integralStrafe + (-robotLeftError) * dt,
                                -MAX_INTEGRAL_POWER / KI_STRAFE, MAX_INTEGRAL_POWER / KI_STRAFE);
                    } else integralStrafe = 0.0;

                    double translationScale = (headingErrorDeg > 25.0) ? 0.85 : 1.0;

                    if (!isAtForward) {
                        double dTerm = KD_FORWARD * robotVelFwd;
                        double pidFwd = (KP_FORWARD * robotForwardError) + (KI_FORWARD * integralFwd) - dTerm;
                        forwardCmd = applyMinPower(forwardSign * pidFwd * translationScale, MIN_FORWARD_POWER, maxSpeed);
                    }

                    if (!isAtStrafe) {
                        double dTerm = KD_STRAFE * (-robotVelLeft);
                        double pidStrafe = (KP_STRAFE * (-robotLeftError)) + (KI_STRAFE * integralStrafe) - dTerm;
                        strafeRightCmd = applyMinPower(strafeSign * pidStrafe * translationScale, MIN_STRAFE_POWER, maxSpeed);
                    }
                }

                if (headingErrorDeg < 15.0 && !isAtHeading) {
                    integralTurn = Range.clip(integralTurn + (-errorHeading) * dt,
                            -MAX_INTEGRAL_POWER / KI_HEADING, MAX_INTEGRAL_POWER / KI_HEADING);
                } else integralTurn = 0.0;

                double turnRightCmd = 0.0;
                if (!isAtHeading) {
                    double dTurn = isPassThroughSegment ? 0.0 : (KD_HEADING * (-velHeading));
                    double pidTurn = (KP_HEADING * (-errorHeading)) + (KI_HEADING * integralTurn) - dTurn;
                    turnRightCmd = applyMinPower(turnSign * pidTurn, MIN_TURN_POWER, MAX_TURN_SPEED);
                }

                double flPower = forwardCmd + strafeRightCmd + turnRightCmd;
                double frPower = forwardCmd - strafeRightCmd - turnRightCmd;
                double blPower = forwardCmd - strafeRightCmd + turnRightCmd;
                double brPower = forwardCmd + strafeRightCmd - turnRightCmd;

                double maxWheel = Math.max(
                        Math.max(Math.abs(flPower), Math.abs(frPower)),
                        Math.max(Math.abs(blPower), Math.abs(brPower))
                );
                if (maxWheel > maxSpeed) {
                    flPower = (flPower / maxWheel) * maxSpeed;
                    frPower = (frPower / maxWheel) * maxSpeed;
                    blPower = (blPower / maxWheel) * maxSpeed;
                    brPower = (brPower / maxWheel) * maxSpeed;
                }

                setDrivePowers(flPower, frPower, blPower, brPower);
            }

            telemetry.addData("Active Dot", "%d / %d (%s)", currentIndex + 1, PATH.length, target.label);
            telemetry.addData("Target (X, Y, H)", "(%.1f in, %.1f in, %.1f°)",
                    target.xInches, target.yInches, target.headingDeg);
            telemetry.addData("Robot  (X, Y, H)", "(%.2f in, %.2f in, %.1f°)",
                    poseX, poseY, Math.toDegrees(poseHeading));
            telemetry.update();
        }
    }

    private void clearIntegrals() { integralFwd = 0.0; integralStrafe = 0.0; integralTurn = 0.0; }

    private void setZeroPowerMode(DcMotor.ZeroPowerBehavior mode) {
        if (currentlyBraking == (mode == DcMotor.ZeroPowerBehavior.BRAKE)) return;
        currentlyBraking = (mode == DcMotor.ZeroPowerBehavior.BRAKE);
        frontLeft.setZeroPowerBehavior(mode);
        frontRight.setZeroPowerBehavior(mode);
        backLeft.setZeroPowerBehavior(mode);
        backRight.setZeroPowerBehavior(mode);
    }

    private double applyMinPower(double command, double minPower, double maxPower) {
        if (Math.abs(command) < 1e-6) return 0.0;
        double sign = Math.signum(command);
        double magnitude = Math.max(Math.abs(command), minPower);
        return Range.clip(sign * magnitude, -maxPower, maxPower);
    }

    private void updateOdometry() {
        odo.update();
        Pose2D pinpointPose = odo.getPosition();
        poseX = pinpointPose.getX(DistanceUnit.INCH);
        poseY = pinpointPose.getY(DistanceUnit.INCH);
        poseHeading = pinpointPose.getHeading(AngleUnit.RADIANS);
        velX = odo.getVelX(DistanceUnit.INCH);
        velY = odo.getVelY(DistanceUnit.INCH);
        velHeading = odo.getHeadingVelocity(UnnormalizedAngleUnit.RADIANS);
    }

    private void resetOriginAndRestart() {
        setDrivePowers(0, 0, 0, 0);
        odo.setPosition(new Pose2D(DistanceUnit.INCH, 0, 0, AngleUnit.RADIANS, 0));
        odo.update();
        poseX = 0.0; poseY = 0.0; poseHeading = 0.0;
        currentIndex = 0; waitingAtDot = false;
        clearIntegrals(); loopTimer.reset();
    }

    private void setDrivePowers(double fl, double fr, double bl, double br) {
        frontLeft.setPower(fl); frontRight.setPower(fr);
        backLeft.setPower(bl);  backRight.setPower(br);
    }
}
`;
    }

    function refreshOutput() {
      let totalDist = 0;
      let prev = { x: 0, y: 0 };
      waypoints.forEach(wp => {
        totalDist += Math.hypot(wp.x - prev.x, wp.y - prev.y);
        prev = wp;
      });
      document.getElementById('totalDistReadout').textContent = `${totalDist.toFixed(1)} in`;
      const cls = getCleanClassName();
      document.getElementById('fileNameLabel').textContent = `${cls}.java`;
      document.getElementById('codePreview').textContent = generateJavaSource();
    }

    function refreshAll() {
      drawField();
      renderWaypointList();
      refreshOutput();
    }

    function copyJavaCode() {
      const code = generateJavaSource();
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.autoPathBridge) {
        window.webkit.messageHandlers.autoPathBridge.postMessage({ action: 'copy', code: code });
        showToast('★ COPIED TO CLIPBOARD!');
      } else {
        navigator.clipboard.writeText(code).then(() => showToast('★ COPIED TO CLIPBOARD!'));
      }
    }

    function downloadJavaFile() {
      const cls = getCleanClassName();
      const fileName = `${cls}.java`;
      const code = generateJavaSource();
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.autoPathBridge) {
        window.webkit.messageHandlers.autoPathBridge.postMessage({
          action: 'saveDialog',
          fileName: fileName,
          code: code
        });
      } else {
        const blob = new Blob([code], { type: 'text/x-java-source;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast(`★ DOWNLOADED ${fileName}`);
      }
    }

    function sendToAndroidStudio() {
      const cls = getCleanClassName();
      const fileName = `${cls}.java`;
      const code = generateJavaSource();
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.autoPathBridge) {
        window.webkit.messageHandlers.autoPathBridge.postMessage({
          action: 'sendToTeamCode',
          fileName: fileName,
          code: code
        });
      } else {
        downloadJavaFile();
      }
    }

    // Ensure canvas re-renders once the embedded Minecraft pixel font finishes loading
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => drawField());
    }
    refreshAll();
  </script>
</body>
</html>
